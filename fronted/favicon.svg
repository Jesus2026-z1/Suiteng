<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo oscuro con esquinas redondeadas -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Servidor (Fondo) -->
  <rect x="10" y="6" width="44" height="52" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Ranuras del servidor -->
  <line x1="14" y1="14" x2="50" y2="14" stroke="#475569" stroke-width="2"/>
  <line x1="14" y1="22" x2="50" y2="22" stroke="#475569" stroke-width="2"/>
  <line x1="14" y1="30" x2="50" y2="30" stroke="#475569" stroke-width="2"/>
  <line x1="14" y1="38" x2="50" y2="38" stroke="#475569" stroke-width="2"/>
  <line x1="14" y1="46" x2="50" y2="46" stroke="#475569" stroke-width="2"/>
  <!-- Luces del servidor (indicadores) -->
  <circle cx="18" cy="10" r="1.5" fill="#38bdf8"/>
  <circle cx="24" cy="10" r="1.5" fill="#38bdf8"/>
  <circle cx="18" cy="18" r="1.5" fill="#fbbf24"/>
  <circle cx="24" cy="18" r="1.5" fill="#38bdf8"/>
  <circle cx="18" cy="26" r="1.5" fill="#38bdf8"/>
  <circle cx="24" cy="26" r="1.5" fill="#38bdf8"/>
  <circle cx="18" cy="34" r="1.5" fill="#fbbf24"/>
  <circle cx="24" cy="34" r="1.5" fill="#38bdf8"/>
  <circle cx="18" cy="42" r="1.5" fill="#38bdf8"/>
  <circle cx="24" cy="42" r="1.5" fill="#38bdf8"/>

  <!-- Gráfica de crecimiento (Barras azules) -->
  <rect x="14" y="42" width="6" height="12" fill="#3b82f6" fill-opacity="0.9"/>
  <rect x="22" y="34" width="6" height="20" fill="#3b82f6" fill-opacity="0.9"/>
  <rect x="30" y="24" width="6" height="30" fill="#3b82f6" fill-opacity="0.9"/>
  <rect x="38" y="34" width="6" height="20" fill="#3b82f6" fill-opacity="0.9"/>
  <rect x="46" y="42" width="6" height="12" fill="#3b82f6" fill-opacity="0.9"/>

  <!-- Campana de Gauss (Curva roja) -->
  <path d="M 8 54 Q 20 34 32 16 Q 44 34 56 54" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>