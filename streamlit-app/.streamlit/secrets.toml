[paypal]
# Modo: "sandbox" para pruebas, "live" para producción
MODO = "sandbox"

# Credenciales de PayPal (obtenidas de developer.paypal.com)
CLIENT_ID_SANDBOX = "tu_client_id_sandbox_aqui"
CLIENT_SECRET_SANDBOX = "tu_client_secret_sandbox_aqui"
CLIENT_ID_LIVE = "tu_client_id_live_aqui"
CLIENT_SECRET_LIVE = "tu_client_secret_live_aqui"

# URL de retorno después del pago
RETURN_URL = "http://localhost:8501/Pagos"
CANCEL_URL = "http://localhost:8501/Pagos"

[planes]
